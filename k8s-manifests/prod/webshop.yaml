apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebshop-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mywebshop
  template:
    metadata:
      labels:
        app: mywebshop
    spec:
      containers:
        - name: nginx
          image: dsoadmin/caepe-webshop-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mywebshop-service
spec:
  selector:
    app: mywebshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mywebshop-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host:
      http:
        paths:
          - path: /mywebshop/
            pathType: prefix
            backend:
              service:
                name: mywebshop-service
                port:
                  number: 80
