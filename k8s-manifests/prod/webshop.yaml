apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebshop-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mywebshop
  template:
    metadata:
      labels:
        app: mywebshop
    spec:
      containers:
        - name: nginx
          image: dsoadmin/caepe-webshop-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mywebshop-service
spec:
  selector:
    app: mywebshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mywebshop
  namespace: mywebshop
spec:
  stripPrefix:
    prefixes:
      - /mywebshop
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mywebshop-ingress
  namespace: mywebshop
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mywebshop-strip-mywebshop@kubernetescrd
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /mywebshop
            pathType: Prefix
            backend:
              service:
                name: mywebshop-service
                port:
                  number: 80
