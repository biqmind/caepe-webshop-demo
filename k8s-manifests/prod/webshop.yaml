apiVersion: apps/v1
kind: Deployment
metadata:
  name: caepe-webshop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caepe-webshop-demo
  template:
    metadata:
      labels:
        app: caepe-webshop-demo
    spec:
      containers:
        - name: caepe-webshop-demo
          image: dsoadmin/caepe-webshop-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: caepe-webshop-demo
spec:
  selector:
    app: caepe-webshop-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caepe-webshop-demo
spec:
  parentRefs: # NOTE: the parentRefs are cluster-setup dependent.
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: caepe-webshop-demo
          port: 80
