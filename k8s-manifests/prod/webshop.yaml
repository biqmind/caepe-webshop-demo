apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebshop2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mywebshop2
  template:
    metadata:
      labels:
        app: mywebshop2
    spec:
      containers:
        - name: nginx
          image: dsoadmin/caepe-webshop-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mywebshop2-service
spec:
  selector:
    app: mywebshop2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mywebshop2
spec:
  stripPrefix:
    prefixes:
      - /mywebshop2
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mywebshop2-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mywebshop2-strip-mywebshop2@kubernetescrd
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /mywebshop2
            pathType: Prefix
            backend:
              service:
                name: mywebsho2p-service
                port:
                  number: 80
